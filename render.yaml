services:
  - type: web
    name: hireminds-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DB_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: BHASHINI_UDYAT_KEY
        sync: false
      - key: BHASHINI_INFERENCE_KEY
        sync: false
      - key: BHASHINI_PIPELINE_ID
        value: 64392f96daac500b55c543cd
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
